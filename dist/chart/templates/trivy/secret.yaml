{{- if and .Values.trivy.enabled (not .Values.trivy.token.existingSecret) }}
{{- /* Generated once and kept on upgrades. */}}
{{- $name := include "tagwarden.resourceName" (dict "suffix" "trivy-token" "context" .) }}
{{- $token := randAlphaNum 40 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token = index .data "token" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagwarden.trivyLabels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token }}
{{- end }}
