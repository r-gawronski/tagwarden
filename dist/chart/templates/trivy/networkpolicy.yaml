{{- if and .Values.trivy.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tagwarden.trivyName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tagwarden.trivyLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tagwarden.trivySelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tagwarden.dev/scanner: trivy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "tagwarden.name" . }}
              control-plane: controller-manager
      ports:
        - port: 4954
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- range .Values.trivy.networkPolicy.registryEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - port: {{ .port }}
          protocol: TCP
    {{- end }}
{{- end }}
