{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: clustermirrortargets.mirror.tagwarden.dev
spec:
  group: mirror.tagwarden.dev
  names:
    kind: ClusterMirrorTarget
    listKind: ClusterMirrorTargetList
    plural: clustermirrortargets
    singular: clustermirrortarget
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.registry
      name: Registry
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ClusterMirrorTarget is a target registry owned by the platform
          team.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ClusterMirrorTarget
            properties:
              allowedSources:
                description: allowedSources lists the upstream registry hosts that
                  mirrors may pull from.
                items:
                  description: |-
                    RegistryHost is a registry host name or bracketed IP address with an
                    optional port, for example registry.example.internal:8443 or [::1]:5000.
                    It has no scheme, credentials or path.
                  maxLength: 253
                  minLength: 1
                  type: string
                  x-kubernetes-validations:
                  - message: must be host[:port] without a scheme, credentials or
                      path
                    rule: self.matches(r'^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[0-9a-fA-F:.]+\])(:[0-9]{1,5})?$')
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              auth:
                description: |-
                  auth pushes to the target registry with a cloud workload identity
                  instead of credentialsSecretRef.
                properties:
                  awsWorkloadIdentity:
                    description: |-
                      awsWorkloadIdentity pushes to an Amazon ECR private registry with
                      the role in spec.workloadIdentity.aws.
                    type: object
                  azureWorkloadIdentity:
                    description: |-
                      azureWorkloadIdentity pushes to an Azure Container Registry with
                      the identity in spec.workloadIdentity.azure.
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one provider
                  rule: has(self.azureWorkloadIdentity) != has(self.awsWorkloadIdentity)
              autoMirror:
                description: autoMirror lets annotated pods request mirrors of their
                  images.
                properties:
                  enabled:
                    description: |-
                      enabled turns annotation-driven mirroring on for this target. Without
                      it the annotation only produces a Warning Event on the pod.
                    type: boolean
                  maxMirrorsPerNamespace:
                    default: 20
                    description: |-
                      maxMirrorsPerNamespace caps the generated mirrors of one namespace for
                      this target. Defaults to 20.
                    format: int32
                    maximum: 200
                    minimum: 1
                    type: integer
                  project:
                    description: |-
                      project is the target project of generated mirrors. It must be listed
                      in projects and allow the namespace of the pod.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*$
                    type: string
                  schedule:
                    default: 0 */6 * * *
                    description: |-
                      schedule is the cron schedule of generated mirrors. It must respect
                      limits.minSyncInterval. New tags also trigger a sync right away.
                    maxLength: 100
                    type: string
                    x-kubernetes-validations:
                    - message: must be a 5-field cron expression or a macro such as
                        @daily
                      rule: self.matches('^(@(yearly|annually|monthly|weekly|daily|midnight|hourly)|[0-9A-Za-z*/,?-]+(
                        +[0-9A-Za-z*/,?-]+){4})$')
                required:
                - project
                type: object
              caBundleSecretRef:
                description: caBundleSecretRef holds the CA bundle for the target
                  registry.
                properties:
                  key:
                    default: ca.crt
                    description: key in the Secret that holds the PEM data.
                    maxLength: 253
                    minLength: 1
                    type: string
                  name:
                    description: name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              clientCertSecretRef:
                description: |-
                  clientCertSecretRef holds a client certificate for mTLS to the target registry
                  (a kubernetes.io/tls Secret).
                properties:
                  name:
                    description: name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              credentialsSecretRef:
                description: |-
                  credentialsSecretRef holds the push credentials for the target registry
                  (a kubernetes.io/dockerconfigjson Secret in the operator namespace).
                  Set it or auth.
                properties:
                  name:
                    description: name of the Secret.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              limits:
                description: |-
                  limits caps schedules, mirrors, tags and artifact sizes per tenant.
                  Defaults apply when it is absent.
                properties:
                  maxArtifactSize:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      maxArtifactSize caps the size of one artifact: config and layers of
                      the manifest, or of every manifest in an index. The referrers copied
                      for an artifact in one run, such as signatures and SBOMs, share a
                      separate budget of the same size. The sync Job reports a larger
                      artifact as failed and copies nothing of it; for oversized referrers
                      the tag fails and does not move. No limit when absent.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                    x-kubernetes-validations:
                    - message: must be positive
                      rule: quantity(string(self)).isGreaterThan(quantity('0'))
                  maxExplicitTags:
                    description: maxExplicitTags caps the number of tags.tags of a
                      mirror. Defaults to 50.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  maxKeepLatest:
                    description: maxKeepLatest caps tags.keepLatest of a mirror. Defaults
                      to 20.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  maxMirrorsPerNamespace:
                    description: |-
                      maxMirrorsPerNamespace caps the ArtifactMirrors of one namespace that
                      use this target. The oldest ones win, by creation time and then name;
                      the others get Ready=False with reason LimitExceeded. Defaults to 50.
                    format: int32
                    minimum: 1
                    type: integer
                  minSyncInterval:
                    description: |-
                      minSyncInterval is the smallest allowed gap between two runs of a
                      mirror's schedule. A mirror whose schedule runs more often gets
                      Ready=False with reason ScheduleTooFrequent. Defaults to 1h. At least 5m.
                    type: string
                    x-kubernetes-validations:
                    - message: must be at least 5m
                      rule: duration(self) >= duration('5m')
                type: object
              policy:
                default: {}
                description: policy holds the default policy for mirrors that use
                  this target.
                properties:
                  onTagMutation:
                    default: Fail
                    description: onTagMutation is the action taken when an upstream
                      tag points to a new digest.
                    enum:
                    - Fail
                    - Overwrite
                    - Ignore
                    type: string
                type: object
              projects:
                description: |-
                  projects lists the target registry projects that mirrors may push to,
                  and which namespaces may use each one. A mirror may push only to a
                  listed project whose namespaceSelector matches the mirror's namespace.
                  The controller enforces this at reconcile.
                items:
                  description: TargetProject is a project in the target registry and
                    the namespaces allowed to use it.
                  properties:
                    allowRepositoryOverride:
                      description: |-
                        allowRepositoryOverride lets ArtifactMirrors in this project set
                        target.repository to a path other than the default. When false, they
                        must use the default path <source-registry>/<source-repository>, so a
                        tenant cannot claim the path of another source. Enable it only for
                        projects owned by a single team.
                      type: boolean
                    name:
                      description: name of the project, a single path segment.
                      maxLength: 255
                      minLength: 1
                      pattern: ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*$
                      type: string
                    namespaceSelector:
                      description: |-
                        namespaceSelector selects the namespaces whose ArtifactMirrors may push
                        to this project. It is required so that access is always an explicit
                        decision. An empty selector ({}) allows every namespace, which suits a
                        shared project. Team projects use a label selector.
                      properties:
                        matchExpressions:
                          description: matchExpressions is a list of label selector
                            requirements. The requirements are ANDed.
                          items:
                            description: |-
                              A label selector requirement is a selector that contains values, a key, and an operator that
                              relates the key and values.
                            properties:
                              key:
                                description: key is the label key that the selector
                                  applies to.
                                type: string
                              operator:
                                description: |-
                                  operator represents a key's relationship to a set of values.
                                  Valid operators are In, NotIn, Exists and DoesNotExist.
                                type: string
                              values:
                                description: |-
                                  values is an array of string values. If the operator is In or NotIn,
                                  the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                  the values array must be empty. This array is replaced during a strategic
                                  merge patch.
                                items:
                                  type: string
                                type: array
                                x-kubernetes-list-type: atomic
                            required:
                            - key
                            - operator
                            type: object
                          type: array
                          x-kubernetes-list-type: atomic
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: |-
                            matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                            map is equivalent to an element of matchExpressions, whose key field is "key", the
                            operator is "In", and the values array contains only "value". The requirements are ANDed.
                          type: object
                      type: object
                      x-kubernetes-map-type: atomic
                  required:
                  - name
                  - namespaceSelector
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              proxy:
                description: proxy configures the proxy for upstream traffic.
                properties:
                  caBundleSecretRef:
                    description: |-
                      caBundleSecretRef holds the CA that signs the proxy certificates, for example a TLS-inspection CA.
                      It is trusted only by the sync Job.
                    properties:
                      key:
                        default: ca.crt
                        description: key in the Secret that holds the PEM data.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  credentialsSecretRef:
                    description: |-
                      credentialsSecretRef holds the proxy username and password
                      (a kubernetes.io/basic-auth Secret).
                    properties:
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  httpsProxy:
                    description: |-
                      httpsProxy is the proxy URL, for example http://proxy.example.internal:3128.
                      Credentials must not be part of the URL. Use credentialsSecretRef.
                    maxLength: 2048
                    type: string
                    x-kubernetes-validations:
                    - message: must be an http or https URL
                      rule: isURL(self) && (self.startsWith('http://') || self.startsWith('https://'))
                    - message: must not contain credentials, use credentialsSecretRef
                      rule: '!self.contains(''@'')'
                  noProxy:
                    description: noProxy lists hosts, domains and CIDRs that bypass
                      the proxy.
                    items:
                      maxLength: 253
                      type: string
                    maxItems: 100
                    type: array
                    x-kubernetes-list-type: set
                required:
                - httpsProxy
                type: object
              registry:
                description: registry is the target registry as host[:port], without
                  a scheme.
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: must be host[:port] without a scheme, credentials or path
                  rule: self.matches(r'^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[0-9a-fA-F:.]+\])(:[0-9]{1,5})?$')
              sourceCABundles:
                description: |-
                  sourceCABundles lists extra root CAs per source registry, for
                  upstreams signed by a private CA. Each CA is mounted only in sync
                  pods of that source and trusted there for every host the source
                  transport reaches (the registry, its redirect and token hosts), never
                  for the target. It adds to the system roots. Tenants never see or
                  reference these Secrets: the platform team decides which sources
                  have private CAs. At most one entry per registry.
                items:
                  description: SourceCABundle holds extra root CAs for one source
                    registry.
                  properties:
                    registry:
                      description: |-
                        registry is the source registry that trusts the CA. The Docker Hub
                        names count as one registry.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: must be host[:port] without a scheme, credentials
                          or path
                        rule: self.matches(r'^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[0-9a-fA-F:.]+\])(:[0-9]{1,5})?$')
                    secretRef:
                      description: |-
                        secretRef is a Secret in the operator namespace with PEM
                        certificates under the key.
                      properties:
                        key:
                          default: ca.crt
                          description: key in the Secret that holds the PEM data.
                          maxLength: 253
                          minLength: 1
                          type: string
                        name:
                          description: name of the Secret.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - registry
                  - secretRef
                  type: object
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - registry
                x-kubernetes-list-type: map
              sourceCredentials:
                description: |-
                  sourceCredentials lists pull credentials per source registry. A sync
                  Job gets only the entry for its own source; a source without an entry
                  is pulled anonymously. Tenants never see or reference these Secrets:
                  the platform team decides which sources have accounts. At most one
                  entry per registry; the controller rejects duplicates, Docker Hub
                  names included.
                items:
                  description: |-
                    SourceCredential holds the pull credentials for one source registry:
                    a Secret or a cloud workload identity.
                  properties:
                    awsWorkloadIdentity:
                      description: |-
                        awsWorkloadIdentity pulls from an Amazon ECR private registry with
                        the role in spec.workloadIdentity.aws.
                      type: object
                    azureWorkloadIdentity:
                      description: |-
                        azureWorkloadIdentity pulls from an Azure Container Registry with
                        the identity in spec.workloadIdentity.azure.
                      type: object
                    registry:
                      description: |-
                        registry is the source registry these credentials are for. The Docker
                        Hub names docker.io, index.docker.io and registry-1.docker.io count as
                        one registry.
                      maxLength: 253
                      minLength: 1
                      type: string
                      x-kubernetes-validations:
                      - message: must be host[:port] without a scheme, credentials
                          or path
                        rule: self.matches(r'^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[0-9a-fA-F:.]+\])(:[0-9]{1,5})?$')
                    secretRef:
                      description: |-
                        secretRef is a kubernetes.io/dockerconfigjson Secret in the operator
                        namespace with an auths entry for the registry.
                      properties:
                        name:
                          description: name of the Secret.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                      - name
                      type: object
                  required:
                  - registry
                  type: object
                  x-kubernetes-validations:
                  - message: set exactly one of secretRef, azureWorkloadIdentity or
                      awsWorkloadIdentity
                    rule: '[has(self.secretRef), has(self.azureWorkloadIdentity),
                      has(self.awsWorkloadIdentity)].filter(x, x).size() == 1'
                  - message: azureWorkloadIdentity needs an Azure Container Registry
                      host (*.azurecr.io, *.azurecr.us or *.azurecr.cn)
                    rule: '!has(self.azureWorkloadIdentity) || self.registry.lowerAscii().matches(r''^[a-z0-9]+(-[a-z0-9]+)?\.azurecr\.(io|us|cn)(:443)?$'')'
                  - message: awsWorkloadIdentity needs an Amazon ECR private registry
                      host (<account>.dkr.ecr.<region>.amazonaws.com)
                    rule: '!has(self.awsWorkloadIdentity) || self.registry.lowerAscii().matches(r''^[0-9]{12}\.dkr\.ecr(-fips)?\.[a-z0-9-]+\.amazonaws\.com(\.cn)?(:443)?$'')'
                maxItems: 50
                type: array
                x-kubernetes-list-map-keys:
                - registry
                x-kubernetes-list-type: map
              workloadIdentity:
                description: |-
                  workloadIdentity is the cloud identity used by auth and by
                  sourceCredentials entries that name a cloud provider. Required when
                  any of them does.
                properties:
                  aws:
                    description: |-
                      aws is the IAM role that trusts the cluster's OIDC provider for the
                      ServiceAccount (IAM roles for service accounts).
                    properties:
                      region:
                        description: |-
                          region is the AWS Region of the STS and ECR API endpoints, for
                          example eu-west-1. Registries that use this role must be in it.
                        maxLength: 32
                        pattern: ^((us|eu|ap|sa|ca|me|af|il|mx|cn)-[a-z]+|us-gov-[a-z]+)-[0-9]{1,2}$
                        type: string
                      roleARN:
                        description: |-
                          roleARN is the IAM role, for example
                          arn:aws:iam::123456789012:role/tagwarden-sync.
                        maxLength: 2048
                        pattern: ^arn:aws(-cn|-us-gov)?:iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]{1,576}$
                        type: string
                    required:
                    - region
                    - roleARN
                    type: object
                    x-kubernetes-validations:
                    - message: roleARN and region must be in the same AWS partition
                      rule: self.roleARN.startsWith('arn:aws-cn:') == self.region.startsWith('cn-')
                        && self.roleARN.startsWith('arn:aws-us-gov:') == self.region.startsWith('us-gov-')
                  azure:
                    description: |-
                      azure is the Microsoft Entra application or user-assigned managed
                      identity with a federated credential for the ServiceAccount.
                    properties:
                      authorityHost:
                        description: |-
                          authorityHost is the Microsoft Entra endpoint: one of
                          https://login.microsoftonline.com/ (the default),
                          https://login.microsoftonline.us/,
                          https://login.partner.microsoftonline.cn/ or
                          https://login.chinacloudapi.cn/. The registry token is always
                          requested for https://containerregistry.azure.net/.default.
                        maxLength: 2048
                        type: string
                        x-kubernetes-validations:
                        - message: must be a known Microsoft Entra authority host
                          rule: self.matches(r'^https://(login\.microsoftonline\.(com|us)|login\.partner\.microsoftonline\.cn|login\.chinacloudapi\.cn)/?$')
                      clientID:
                        description: clientID is the application (client) ID of the
                          identity.
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                        type: string
                      tenantID:
                        description: tenantID is the directory (tenant) ID of the
                          identity.
                        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                        type: string
                    required:
                    - clientID
                    - tenantID
                    type: object
                  serviceAccountName:
                    description: |-
                      serviceAccountName is the ServiceAccount in the operator namespace
                      that sync pods run as when they use cloud registry auth. Its token
                      is never mounted; the pods get only a projected token with the
                      cloud audience. Defaults to tagwarden-sync.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                type: object
            required:
            - allowedSources
            - projects
            - registry
            type: object
            x-kubernetes-validations:
            - message: autoMirror.project must be listed in projects
              rule: '!has(self.autoMirror) || self.projects.exists(p, p.name == self.autoMirror.project)'
            - message: autoMirror.project must not allow repository overrides, so
                node pulls through a path rewrite stay bound to one source
              rule: '!has(self.autoMirror) || self.projects.all(p, p.name != self.autoMirror.project
                || !has(p.allowRepositoryOverride) || !p.allowRepositoryOverride)'
            - message: set exactly one of credentialsSecretRef or auth
              rule: has(self.credentialsSecretRef) != has(self.auth)
            - message: auth.azureWorkloadIdentity needs an Azure Container Registry
                host (*.azurecr.io, *.azurecr.us or *.azurecr.cn)
              rule: '!has(self.auth) || !has(self.auth.azureWorkloadIdentity) || self.registry.lowerAscii().matches(r''^[a-z0-9]+(-[a-z0-9]+)?\.azurecr\.(io|us|cn)(:443)?$'')'
            - message: auth.awsWorkloadIdentity needs an Amazon ECR private registry
                host (<account>.dkr.ecr.<region>.amazonaws.com)
              rule: '!has(self.auth) || !has(self.auth.awsWorkloadIdentity) || self.registry.lowerAscii().matches(r''^[0-9]{12}\.dkr\.ecr(-fips)?\.[a-z0-9-]+\.amazonaws\.com(\.cn)?(:443)?$'')'
          status:
            description: status defines the observed state of ClusterMirrorTarget
            properties:
              conditions:
                description: |-
                  conditions represent the current state. The Ready condition reports
                  whether the resource is usable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
