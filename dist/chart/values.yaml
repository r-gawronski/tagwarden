## Hand-maintained: make helm keeps this file. values.schema.json rejects
## unknown keys, so update both together. See docs/design/helm-chart.md.

## Override the chart name in object names (the release name is kept).
# nameOverride: ""

## Override the full object name prefix.
# fullnameOverride: ""

## Controller manager Deployment.
manager:
  replicas: 1

  image:
    ## No image is published yet. Set the registry the operator image was
    ## built or mirrored into.
    repository: registry.example.internal/tagwarden/tagwarden
    ## Defaults to the chart appVersion.
    tag: ""
    ## Optional sha256 digest. When set, the image is pulled by digest.
    digest: ""
    pullPolicy: IfNotPresent

  ## Manager flags. The chart wires the operator through these templates.
  ## The schema requires --sync-image= and --denied-cidrs= entries.
  args:
    - --leader-elect={{ .Values.leaderElection.enabled }}
    - --sync-image={{ include "tagwarden.syncImage" . }}
    - --denied-cidrs={{ join "," .Values.deniedCIDRs }}
    - --cluster-domain={{ .Values.clusterDomain }}
    - --argocd-tracking={{ .Values.argocd.tracking }}
    - --argocd-instance-label={{ .Values.argocd.instanceLabel }}

  healthProbe:
    port: 8081

  ## POD_NAMESPACE makes the release namespace the operator namespace.
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  imagePullSecrets: []

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  affinity: {}
  nodeSelector: {}
  tolerations: []

  terminationGracePeriodSeconds: 10

  ## Extra labels and annotations on the manager pod, for example
  ## k8s.grafana.com/scrape: "true" for annotation-based metrics scraping.
  pod:
    labels: {}
    annotations: {}

  ## Also available: labels, annotations, strategy, priorityClassName,
  ## topologySpreadConstraints.

## Show sync CronJobs in the Argo CD app of their mirror. See docs/argocd.md.
argocd:
  ## "" (off) or "inherit".
  tracking: ""
  ## Label of Argo CD's label tracking mode.
  instanceLabel: app.kubernetes.io/instance

## Image of the sync Jobs. An empty repository means the manager image; an
## empty tag means manager.image.tag.
syncImage:
  repository: ""
  tag: ""
  digest: ""

## Pod and service CIDRs of the cluster, and any other ranges sources must
## not resolve to. Rendered as --denied-cidrs.
deniedCIDRs: []
# - 10.244.0.0/16
# - 10.96.0.0/12

## DNS domain of the cluster, without a trailing dot. The manager dials
## Trivy Service names as <service>.<namespace>.svc.<clusterDomain>. so
## resolv.conf search domains never apply. Rendered as --cluster-domain.
clusterDomain: cluster.local

leaderElection:
  enabled: true

rbac:
  ## Install admin, editor and viewer ClusterRoles for the Tagwarden CRDs.
  helpers:
    enabled: false

## VulnerabilityExceptions of the vulnerability gate. The chart always
## renders the <release>-exception-approver ClusterRole (create, update and
## delete exceptions); the rbac helpers never grant it.
vulnerabilityExceptions:
  ## Subjects bound to the approver ClusterRole, usually the security team.
  ## Empty: no binding.
  approvers: []
  # - kind: Group
  #   name: security-team
  #   apiGroup: rbac.authorization.k8s.io
  ## ValidatingAdmissionPolicy that requires spec.approvedBy to equal the
  ## user who creates or updates an exception. Creating exceptions through
  ## GitOps then needs approvedBy set to the GitOps ServiceAccount user.
  approvedByPolicy:
    enabled: false

## Manager ServiceAccount. The tagwarden-sync ServiceAccount of the sync
## Jobs is always rendered.
serviceAccount:
  enabled: true
  ## Existing ServiceAccount to use when enabled is false.
  # name: ""
  # annotations: {}
  # labels: {}

crd:
  ## Install and upgrade the CRDs with the chart.
  enabled: true
  ## Keep the CRDs, and with them every mirror, on helm uninstall.
  keep: true

metrics:
  enabled: true
  port: 8443
  ## HTTPS with authn and authz (true) or plain HTTP (false).
  secure: true

## Prometheus Operator ServiceMonitor.
prometheus:
  enabled: false
  ## tlsConfig of the endpoint when metrics.secure is true. Scraping needs the
  ## CA that signed the metrics certificate here. serverName is set by the
  ## chart.
  tlsConfig: {}
  # labels: {}
  # annotations: {}

## NetworkPolicy that allows metrics traffic from namespaces labelled
## metrics: enabled.
networkPolicy:
  enabled: false

## Trivy server for the vulnerability gate. See docs/design/vulnerability-gate.md.
## One replica, plain HTTP inside the cluster, guarded by a token and (with
## networkPolicy.enabled) a NetworkPolicy. With networkPolicy.enabled=false the
## server is protected by the token only. The manager gets --trivy-image,
## --trivy-version and --trivy-url from these values.
trivy:
  enabled: false
  ## Pinned by digest, which is required when enabled. tag is the Trivy
  ## version, for example "0.76.1"; the gate checks it against the server.
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  ## How long the scanner sidecar of a gated sync Job may fail to start (image
  ## pull error, bad config, crash loop) before the Job is deleted and the
  ## failure reported. Rendered as --scanner-start-timeout.
  scannerStartTimeout: 5m
  ## One replica only: scans need one cache. The schema rejects more.
  replicas: 1
  ## Vulnerability DB in the target registry, never the internet.
  db:
    ## For example registry.example.internal/platform/ghcr.io/aquasecurity/trivy-db:2
    repository: ""
    ## kubernetes.io/dockerconfigjson Secret with a pull-only account.
    # credentialsSecretRef: {name: trivy-db-pull}
    ## CA of the registry, passed as SSL_CERT_FILE.
    # caBundleSecretRef: {name: registry-ca, key: ca.crt}
  persistence:
    size: 10Gi
    storageClassName: ""
  ## /tmp emptyDir. Holds the DB tarball during a download.
  tmp:
    sizeLimit: 2Gi
  ## Existing Secret with a "token" key. Empty: the chart generates one and
  ## keeps it on upgrades. The upgrade lookup returns nothing under Argo CD and
  ## helm template, which would rotate the token on every render: GitOps
  ## installs must set existingSecret.
  token:
    existingSecret: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  ## Egress is limited to DNS and these ranges. Needs networkPolicy.enabled.
  networkPolicy:
    registryEgress: []
    # - {cidr: 10.0.0.0/24, port: 443}
  nodeSelector: {}
  tolerations: []
  affinity: {}

## ClusterMirrorTargets to create. Each item is {name, spec}; spec is passed
## through as is. Secrets referenced by a target live in the release namespace.
targets: []
# - name: default
#   spec:
#     registry: registry.example.internal
#     credentialsSecretRef:
#       name: registry-push
#     allowedSources: [registry.k8s.io]
#     projects:
#       - name: mirror
#         namespaceSelector: {}

## ArtifactMirrors to create. Each item is {name, namespace, spec}; spec is
## passed through as is.
mirrors: []
