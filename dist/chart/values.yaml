#   namespace: team-a
#   spec:
#     targetRef: default
#     schedule: "0 3 * * *"
#     type: Image
#     source: {registry: registry.k8s.io, repository: pause}
#     target: {project: mirror}
#     tags: {include: ['^\d+\.\d+$'], keepLatest: 3}
