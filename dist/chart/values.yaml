## Hand-maintained: make helm keeps this file. values.schema.json rejects
## unknown keys, so update both together. See docs/design/helm-chart.md.

## Override the chart name in object names (the release name is kept).
# nameOverride: ""

## Override the full object name prefix.
# fullnameOverride: ""

## Controller manager Deployment.
manager:
  replicas: 1

  image:
    ## No image is published yet. Set the registry the operator image was
    ## built or mirrored into.
    repository: registry.example.internal/tagwarden/tagwarden
    ## Defaults to the chart appVersion.
    tag: ""
    ## Optional sha256 digest. When set, the image is pulled by digest.
    digest: ""
    pullPolicy: IfNotPresent

  ## Manager flags. The chart wires the operator through these templates;
  ## when overriding the list, keep them.
  args:
    - --leader-elect={{ .Values.leaderElection.enabled }}
    - --sync-image={{ include "tagwarden.syncImage" . }}
    - --denied-cidrs={{ join "," .Values.deniedCIDRs }}

  healthProbe:
    port: 8081

  ## POD_NAMESPACE makes the release namespace the operator namespace.
  env:
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace

  imagePullSecrets: []

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true

  resources:
    limits:
      cpu: 500m
      memory: 128Mi
    requests:
      cpu: 10m
      memory: 64Mi

  affinity: {}
  nodeSelector: {}
  tolerations: []

  terminationGracePeriodSeconds: 10

  ## Also available: labels, annotations, pod.labels, pod.annotations,
  ## strategy, priorityClassName, topologySpreadConstraints.

## Image of the sync Jobs. An empty repository means the manager image.
syncImage:
  repository: ""
  tag: ""
  digest: ""

## Pod and service CIDRs of the cluster, and any other ranges sources must
## not resolve to. Rendered as --denied-cidrs.
deniedCIDRs: []
# - 10.244.0.0/16
# - 10.96.0.0/12

leaderElection:
  enabled: true

rbac:
  ## Install admin, editor and viewer ClusterRoles for the Tagwarden CRDs.
  helpers:
    enabled: false

## Manager ServiceAccount. The tagwarden-sync ServiceAccount of the sync
## Jobs is always rendered.
serviceAccount:
  enabled: true
  ## Existing ServiceAccount to use when enabled is false.
  # name: ""
  # annotations: {}
  # labels: {}

crd:
  ## Install and upgrade the CRDs with the chart.
  enabled: true
  ## Keep the CRDs, and with them every mirror, on helm uninstall.
  keep: true

metrics:
  enabled: true
  port: 8443
  ## HTTPS with authn and authz (true) or plain HTTP (false).
  secure: true

## Prometheus Operator ServiceMonitor.
prometheus:
  enabled: false
  ## tlsConfig of the endpoint when metrics.secure is true, for example a CA
  ## that signed the metrics certificate. serverName is set by the chart.
  tlsConfig: {}
  # labels: {}
  # annotations: {}

## NetworkPolicy that allows metrics traffic from namespaces labelled
## metrics: enabled.
networkPolicy:
  enabled: false

## ClusterMirrorTargets to create. Each item is {name, spec}; spec is passed
## through as is. Secrets referenced by a target live in the release namespace.
targets: []
# - name: default
#   spec:
#     registry: registry.example.internal
#     credentialsSecretRef:
#       name: registry-push
#     allowedSources: [registry.k8s.io]
#     projects:
#       - name: mirror
#         namespaceSelector: {}

## ArtifactMirrors to create. Each item is {name, namespace, spec}; spec is
## passed through as is.
mirrors: []
