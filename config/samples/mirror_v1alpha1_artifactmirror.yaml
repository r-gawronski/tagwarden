apiVersion: mirror.tagwarden.dev/v1alpha1
kind: ArtifactMirror
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: pause
spec:
  targetRef: default
  schedule: "0 3 * * *"
  type: Image
  source:
    registry: registry.k8s.io
    repository: pause
  # Lands at registry.example.internal/mirror/registry.k8s.io/pause.
  target:
    project: mirror
  tags:
    include:
      - ^\d+\.\d+$
    keepLatest: 3
    prune: true   # <- delete tags this mirror created and no longer selects
  # Optional. Only a value in the target's policy.allowedOnTagMutation
  # (or the target's own value) is accepted; empty uses the target policy.
  # onTagMutation: Overwrite
  requiredPlatforms:
    - linux/amd64
    - linux/arm64
