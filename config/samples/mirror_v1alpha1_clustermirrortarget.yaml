apiVersion: mirror.tagwarden.dev/v1alpha1
kind: ClusterMirrorTarget
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: default
spec:
  registry: registry.example.internal
  # Secrets live in the operator namespace.
  credentialsSecretRef:
    name: registry-push
  caBundleSecretRef:
    name: registry-ca
    key: ca.crt
  proxy:
    httpsProxy: http://proxy.example.internal:3128
    noProxy:
      - .example.internal
    caBundleSecretRef:
      name: proxy-ca
    credentialsSecretRef:
      name: proxy-auth
  allowedSources:
    - registry.k8s.io
    - ghcr.io
  # A mirror pushes only to a listed project whose namespaceSelector
  # matches its namespace. {} allows every namespace.
  projects:
    - name: mirror
      namespaceSelector: {}
    - name: team-a
      namespaceSelector:
        matchLabels:
          example.com/team: a
  policy:
    onTagMutation: Fail
  # Absent fields use the defaults: 1h, 50, 20, 50 and no size limit.
  limits:
    minSyncInterval: 1h
    maxMirrorsPerNamespace: 50
    maxKeepLatest: 20
    maxExplicitTags: 50
    maxArtifactSize: 10Gi
