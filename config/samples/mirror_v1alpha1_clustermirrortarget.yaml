apiVersion: mirror.tagwarden.dev/v1alpha1
kind: ClusterMirrorTarget
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: default
spec:
  registry: registry.example.internal
  # Harbor only: delete tags through the Harbor API. Needs credentialsSecretRef.
  # registryFlavor: Harbor
  # Secrets live in the operator namespace.
  credentialsSecretRef:
    name: registry-push
  caBundleSecretRef:
    name: registry-ca
    key: ca.crt
  proxy:
    httpsProxy: http://proxy.example.internal:3128
    noProxy:
      - .example.internal
    caBundleSecretRef:
      name: proxy-ca
    credentialsSecretRef:
      name: proxy-auth
  # Optional pull credentials and extra CAs per source. Without an entry a
  # source is pulled anonymously.
  sourceCredentials:
    - registry: ghcr.io
      secretRef:
        name: ghcr-pull
  sourceCABundles:
    - registry: registry.corp.example.internal
      secretRef:
        name: corp-registry-ca
        key: ca.crt
  allowedSources:
    - registry.k8s.io
    - ghcr.io
    - registry.corp.example.internal
  # A mirror pushes only to a listed project whose namespaceSelector
  # matches its namespace. {} allows every namespace.
  projects:
    - name: mirror
      namespaceSelector: {}
    - name: team-a
      namespaceSelector:
        matchLabels:
          example.com/team: a
  policy:
    onTagMutation: Fail
    # Values a mirror may set in its own spec.onTagMutation. Empty: none.
    allowedOnTagMutation: [Overwrite]
  # Absent fields use the defaults: 1h, 50, 20, 50, 10000 and no size limit.
  limits:
    minSyncInterval: 1h
    maxMirrorsPerNamespace: 50
    maxKeepLatest: 20
    maxExplicitTags: 50
    maxListedTags: 10000
    maxArtifactSize: 10Gi
  # Let pods annotated with tagwarden.dev/auto-mirror: default request
  # mirrors of their images. The project must be listed above.
  autoMirror:
    enabled: true
    project: mirror
    schedule: "0 */6 * * *"
    maxMirrorsPerNamespace: 20
    # Scan the images of generated mirrors with a Trivy server. Report
    # records findings and copies anyway; Block does not copy.
    vulnerabilityGate:
      enabled: false
      action: Report
      severity: Critical
