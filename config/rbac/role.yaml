---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - artifactmirrors
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - artifactmirrors/finalizers
  verbs:
  - update
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - artifactmirrors/status
  verbs:
  - get
  - patch
  - update
