# Sync Jobs run as this ServiceAccount. It has no RBAC bindings and its
# token is never mounted: sync Jobs do not call the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: sync
  namespace: system
automountServiceAccountToken: false
