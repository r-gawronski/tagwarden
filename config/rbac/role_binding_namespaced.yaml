# Binds the namespaced manager Role, generated from the RBAC markers with
# namespace=system, in the operator namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: manager-namespaced-rolebinding
  namespace: system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-namespaced-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
