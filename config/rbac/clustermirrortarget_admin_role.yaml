# This rule is not used by the project tagwarden itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over mirror.tagwarden.dev.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: clustermirrortarget-admin-role
rules:
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - clustermirrortargets
  verbs:
  - '*'
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - clustermirrortargets/status
  verbs:
  - get
