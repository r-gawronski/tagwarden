# This rule is not used by the project tagwarden itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the mirror.tagwarden.dev.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tagwarden
    app.kubernetes.io/managed-by: kustomize
  name: clustermirrortarget-editor-role
rules:
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - clustermirrortargets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mirror.tagwarden.dev
  resources:
  - clustermirrortargets/status
  verbs:
  - get
