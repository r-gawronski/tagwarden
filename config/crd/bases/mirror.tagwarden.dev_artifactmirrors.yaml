---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: artifactmirrors.mirror.tagwarden.dev
spec:
  group: mirror.tagwarden.dev
  names:
    kind: ArtifactMirror
    listKind: ArtifactMirrorList
    plural: artifactmirrors
    singular: artifactmirror
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.source.repository
      name: Source
      type: string
    - jsonPath: .status.lastSyncTime
      name: Last Sync
      type: date
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ArtifactMirror is a tenant request to mirror an artifact into
          a ClusterMirrorTarget.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of ArtifactMirror
            properties:
              requiredPlatforms:
                description: |-
                  requiredPlatforms lists platforms, as os/arch[/variant], that must
                  exist in the source. A tag missing any of them fails and is not
                  mirrored. The whole index is always mirrored so digests and
                  signatures stay valid.
                items:
                  pattern: ^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9]+)?$
                  type: string
                maxItems: 20
                type: array
                x-kubernetes-list-type: set
              schedule:
                description: |-
                  schedule is a cron expression with 5 fields, or one of @yearly,
                  @annually, @monthly, @weekly, @daily, @midnight, @hourly.
                  Time zone prefixes and @every are not supported.
                maxLength: 100
                type: string
                x-kubernetes-validations:
                - message: must be a 5-field cron expression or a macro such as @daily
                  rule: self.matches('^(@(yearly|annually|monthly|weekly|daily|midnight|hourly)|[0-9A-Za-z*/,?-]+(
                    +[0-9A-Za-z*/,?-]+){4})$')
              source:
                description: source is the upstream artifact.
                properties:
                  registry:
                    description: |-
                      registry is the upstream registry as host[:port], without a scheme.
                      It must be listed in the target's allowedSources.
                    maxLength: 253
                    minLength: 1
                    type: string
                    x-kubernetes-validations:
                    - message: must be host[:port] without a scheme, credentials or
                        path
                      rule: self.matches(r'^([a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?(\.[a-zA-Z0-9]([a-zA-Z0-9-]*[a-zA-Z0-9])?)*|\[[0-9a-fA-F:.]+\])(:[0-9]{1,5})?$')
                  repository:
                    description: repository is the path in the upstream registry,
                      for example library/nginx.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*$
                    type: string
                required:
                - registry
                - repository
                type: object
              suspend:
                description: suspend stops scheduling new syncs.
                type: boolean
              tags:
                description: tags selects the upstream tags to mirror.
                properties:
                  allowPrerelease:
                    description: |-
                      allowPrerelease keeps prerelease versions when semverRange or
                      keepLatest is set. They are dropped by default. A semverRange that
                      names a prerelease, such as ">=1.11.0-0", still needs
                      allowPrerelease: true to select prereleases.
                    type: boolean
                  exclude:
                    description: exclude drops a tag if any pattern matches.
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 20
                    type: array
                    x-kubernetes-list-type: set
                  include:
                    description: |-
                      include keeps a tag if any pattern matches. Patterns are Go RE2
                      regular expressions and are not anchored: use ^...$ for a full match.
                    items:
                      maxLength: 256
                      type: string
                    maxItems: 20
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  keepLatest:
                    description: |-
                      keepLatest keeps only the N highest semver tags after filtering.
                      Tags that are not semver are dropped.
                    format: int32
                    maximum: 100
                    minimum: 1
                    type: integer
                  semverRange:
                    description: |-
                      semverRange keeps semver tags within the constraint, for example ">=1.10.0 <2.0.0".
                      Tags that are not semver are dropped.
                    maxLength: 256
                    minLength: 1
                    type: string
                  tags:
                    description: |-
                      tags lists exact tags to mirror in addition to the selected ones.
                      They bypass all filters. When include, semverRange and keepLatest are
                      unset, only these tags are mirrored.
                    items:
                      pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
                      type: string
                    maxItems: 100
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                type: object
                x-kubernetes-validations:
                - message: set at least one of include, semverRange, keepLatest or
                    tags
                  rule: has(self.include) || has(self.semverRange) || has(self.keepLatest)
                    || has(self.tags)
              target:
                description: target is where the artifact lands in the target registry.
                properties:
                  project:
                    description: |-
                      project is the top-level project in the target registry. It must be
                      listed in the target's projects with a namespaceSelector that matches
                      this mirror's namespace.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*$
                    type: string
                  repository:
                    description: |-
                      repository overrides the path inside the project.
                      Defaults to <source registry>/<source repository>.
                    maxLength: 255
                    minLength: 1
                    pattern: ^[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*(/[a-z0-9]+((\.|_|__|-+)[a-z0-9]+)*)*$
                    type: string
                required:
                - project
                type: object
              targetRef:
                description: targetRef is the name of the ClusterMirrorTarget to mirror
                  into.
                maxLength: 253
                minLength: 1
                type: string
              type:
                default: Image
                description: type is the kind of artifact to mirror.
                enum:
                - Image
                - HelmOCI
                - HelmRepo
                type: string
            required:
            - schedule
            - source
            - tags
            - target
            - targetRef
            type: object
          status:
            description: status defines the observed state of ArtifactMirror
            properties:
              conditions:
                description: |-
                  conditions represent the current state. The Ready condition reports
                  whether the resource is usable.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSuccessfulSyncTime:
                description: lastSuccessfulSyncTime is when the last successful sync
                  finished.
                format: date-time
                type: string
              lastSyncTime:
                description: lastSyncTime is when the last sync finished.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation the status
                  refers to.
                format: int64
                type: integer
              synced:
                description: |-
                  synced lists the mirrored tags and their digests, newest first. The
                  controller keeps at most 200 entries and sets the Synced condition
                  reason Truncated when the list is cut.
                items:
                  description: SyncedTag records a mirrored tag and its digest.
                  properties:
                    digest:
                      description: digest is the manifest digest the tag was copied
                        by.
                      type: string
                    tag:
                      description: tag is the mirrored tag.
                      type: string
                  required:
                  - digest
                  - tag
                  type: object
                maxItems: 200
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
