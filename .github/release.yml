changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels: [security]
    - title: Features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: CI and tooling
      labels: [ci, dependencies, test]
    - title: Other changes
      labels: ["*"]
