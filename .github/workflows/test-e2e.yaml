name: E2E Tests

# Pull requests run e2e only with the `e2e` label (see CONTRIBUTING.md).
# Pushes to main and the weekly schedule always run it.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .github/CODEOWNERS
      - ".github/ISSUE_TEMPLATE/**"
      - .github/pull_request_template.md
      - .github/release.yml
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .github/CODEOWNERS
      - ".github/ISSUE_TEMPLATE/**"
      - .github/pull_request_template.md
      - .github/release.yml
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  test-e2e:
    if: >-
      github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'e2e') &&
      (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    # Job level, so a run that skips the job does not cancel a running one.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Per job: the build cache differs per job, a shared key keeps the smallest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'go.mod', 'Makefile') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Same Dockerfile and tag as `make docker-build` in the suite. The layer cache
      # only helps when the Go sources are unchanged: cache mounts are not exported,
      # so a code change recompiles the manager (about 3 min). mode=min: exporting
      # the builder stage would upload the golang base layers on every run.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          tags: example.com/tagwarden:v0.0.1
          cache-from: type=gha
          cache-to: type=gha,mode=min
      - run: make test-e2e
        env:
          E2E_SKIP_IMAGE_BUILD: "1"
