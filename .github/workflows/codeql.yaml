# While the repository is private, results are not uploaded and any finding fails the job.
name: CodeQL

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .github/CODEOWNERS
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - LICENSE
      - .github/CODEOWNERS
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read # required by CodeQL on private repos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # Per job: the build cache differs per job, a shared key keeps the smallest.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile') }}
          restore-keys: go-${{ runner.os }}-${{ github.job }}-
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Code scanning upload is unavailable while the repository is private.
          upload: ${{ github.event.repository.private && 'never' || 'always' }}
          output: sarif-results
      - name: Fail on CodeQL findings
        if: ${{ github.event.repository.private }}
        run: |
          if ! jq -e '[.runs[].results[]] | length == 0' sarif-results/*.sarif >/dev/null; then
            jq -r '.runs[].results[] | "\(.ruleId) \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif-results/*.sarif
            exit 1
          fi
