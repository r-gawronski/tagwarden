# Builds the operator image and the chart. Pull requests build and scan only.
# Pushes to main publish the image; v* tags (pushed, or dispatched by
# release.yaml) publish the image and the chart,
# both signed keylessly, with an SPDX SBOM attestation per image platform.
# A tag also gets a GitHub Release. See docs/design/release.md.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: # started by release.yaml for a new tag

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only pull requests: a cancelled main run could stop between push and sign.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Cheap classifier: code=false when only docs changed (see scripts/changes.sh).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.c.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: c
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/scripts/changes.sh

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Refuse a dispatch that is not on a tag
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        env:
          REF: ${{ github.ref }}
        run: echo "::error::run this workflow on a v* tag, not on $REF" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: false
      # The docker image store holds one platform. Both share the source and
      # the base image, so the scan covers linux/amd64 (cached from above).
      - name: Load linux/amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: tagwarden:scan
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tagwarden:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  chart-package:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      # Same packaging as the release, with a throwaway version.
      - name: Package and lint the release chart
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: make chart-package CHART_VERSION="0.0.0-ci.${SHA::7}" CHART_IMAGE="ghcr.io/${OWNER,,}/tagwarden"

  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    needs: [changes, image, chart-package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # origin/main for the tag check
          persist-credentials: false
      - name: Compute names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
            if ! [[ "$version" =~ $semver ]]; then
              echo "::error::tag is not v<semver>"
              exit 1
            fi
            git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::tag is not on main"; exit 1; }
          else
            version="main-${SHA::7}"
          fi
          owner="${OWNER,,}"
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "image=ghcr.io/$owner/tagwarden"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.70.0
      - name: Scan every platform of the pushed image
        id: platforms
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          digests=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" \
            | jq -r '.manifests[] | select(.platform.os == "linux") | .digest')
          [ "$(wc -w <<<"$digests")" -eq 2 ] || { echo "::error::expected 2 platform digests"; exit 1; }
          for d in $digests; do
            trivy image --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 "$IMAGE@$d"
          done
          echo "digests=$(tr '\n' ' ' <<<"$digests")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: Sign the image and attest an SBOM per platform
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS: ${{ steps.platforms.outputs.digests }}
          VERSION: ${{ steps.meta.outputs.version }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          cosign sign --yes --recursive "$IMAGE@$DIGEST"
          index=$(docker buildx imagetools inspect --raw "$IMAGE@$DIGEST")
          mkdir -p release
          for d in $DIGESTS; do
            arch=$(jq -r --arg d "$d" '.manifests[] | select(.digest == $d) | .platform.architecture' <<<"$index")
            sbom="release/tagwarden_${VERSION}_linux_${arch}.spdx.json"
            "$SYFT" scan "registry:$IMAGE@$d" -o "spdx-json=$sbom"
            cosign attest --yes --type spdxjson --predicate "$sbom" "$IMAGE@$d"
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: github.ref_type == 'tag'
        with:
          version: v4.1.4
      - name: Package, push and sign the chart
        id: chart
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ steps.meta.outputs.owner }}
          IMAGE: ${{ steps.meta.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make chart-package CHART_VERSION="$VERSION" CHART_IMAGE="$IMAGE"
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "bin/chart/tagwarden-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          digest=$(awk '/^Digest:/ {print $2}' <<<"$out")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no chart digest in helm push output"; exit 1; }
          ref="ghcr.io/$OWNER/charts/tagwarden@$digest"
          cosign sign --yes "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Verify signatures and SBOM attestations
        env:
          REPO: ${{ github.repository }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          DIGESTS: ${{ steps.platforms.outputs.digests }}
          CHART_REF: ${{ steps.chart.outputs.ref }}
        run: |
          check=(--certificate-identity "https://github.com/$REPO/.github/workflows/build.yaml@$GITHUB_REF"
            --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          cosign verify "${check[@]}" "$IMAGE@$DIGEST" >/dev/null
          for d in $DIGESTS; do
            cosign verify "${check[@]}" "$IMAGE@$d" >/dev/null
            cosign verify-attestation --type spdxjson "${check[@]}" "$IMAGE@$d" >/dev/null
          done
          if [ -n "$CHART_REF" ]; then
            cosign verify "${check[@]}" "$CHART_REF" >/dev/null
          fi
          echo "Verified $IMAGE@$DIGEST $DIGESTS $CHART_REF"
      - name: Collect release assets
        if: github.ref_type == 'tag'
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHART_REF: ${{ steps.chart.outputs.ref }}
        run: |
          cp "bin/chart/tagwarden-$VERSION.tgz" release/
          version_re=${VERSION//./\\.}
          cat > release/notes.md <<EOF
          ## Artifacts and verification

          | Artifact | Reference |
          | --- | --- |
          | Image | \`$IMAGE@$DIGEST\` (tag \`$VERSION\`) |
          | Helm chart | \`oci://${CHART_REF%@*}\` version \`$VERSION\`, \`${CHART_REF#*@}\` |
          | SBOMs | \`tagwarden_${VERSION}_linux_amd64.spdx.json\` and \`tagwarden_${VERSION}_linux_arm64.spdx.json\`, attached |

          The release workflow scanned both platform images (linux/amd64 and linux/arm64) with Trivy, signed the image index and each platform image keyless with cosign, attested a signed SPDX SBOM to each platform image and signed the chart. The chart pulls the image by the tag \`$VERSION\`, so verify by digest, never by tag. The commands below check all of it again. You need [Docker](https://docs.docker.com/engine/install/), jq and [cosign](https://docs.sigstore.dev/cosign/system_config/installation/) 3.x or later (the signatures are stored as Sigstore bundles, which cosign 2.x does not find). Details: [release design](https://github.com/$REPO/blob/v$VERSION/docs/design/release.md).

          \`\`\`bash
          ISSUER=https://token.actions.githubusercontent.com
          IDENTITY='^https://github\\.com/$REPO/\\.github/workflows/build\\.yaml@refs/tags/v$version_re\$'
          IMAGE=$IMAGE@$DIGEST
          CHART=$CHART_REF

          cosign verify --certificate-identity-regexp "\$IDENTITY" --certificate-oidc-issuer "\$ISSUER" "\$IMAGE"
          # One SBOM per platform image, attested on the digest of each.
          for arch in amd64 arm64; do
            child="\$(docker buildx imagetools inspect --raw "\$IMAGE" | jq -r --arg a "\$arch" \\
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == \$a) | .digest')"
            cosign verify-attestation --type spdxjson --certificate-identity-regexp "\$IDENTITY" \\
              --certificate-oidc-issuer "\$ISSUER" "\${IMAGE%@*}@\$child" > /dev/null
          done
          cosign verify --certificate-identity-regexp "\$IDENTITY" --certificate-oidc-issuer "\$ISSUER" "\$CHART"

          # Install the chart you verified: the digest in the reference means nothing can move in between.
          helm install tagwarden "oci://\$CHART" \\
            --namespace tagwarden-system --create-namespace \\
            --set 'deniedCIDRs={10.244.0.0/16,10.96.0.0/12}'
          \`\`\`

          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref_type == 'tag'
        with:
          name: release
          path: release/
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          V=${TAG#v}
          notes=(--notes-file release/notes.md)
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GH_REPO/contents/CHANGELOG.md?ref=$TAG" > CHANGELOG.md || : > CHANGELOG.md
          awk -v v="$V" '/^## \[/ { on = index($0, "## [" v "]") == 1 } on' CHANGELOG.md > changelog.md
          if grep -q '[^[:space:]]' changelog.md; then
            cat changelog.md > full.md
            printf '\n' >> full.md
            cat release/notes.md >> full.md
            notes=(--notes-file full.md)
          else
            echo "::warning::CHANGELOG.md has no section for $V; falling back to generated notes"
            notes+=(--generate-notes)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" "${pre[@]}" "${notes[@]}" \
            release/*.tgz release/*.spdx.json
