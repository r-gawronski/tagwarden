# Builds the operator image and the chart. Pull requests build and scan only.
# Pushes to main publish the image; v* tags publish the image and the chart,
# both signed keylessly with an SPDX SBOM attestation. See docs/design/release.md.
name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: false
      # The docker image store holds one platform. Both share the source and
      # the base image, so the scan covers linux/amd64 (cached from above).
      - name: Load linux/amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          provenance: false
          sbom: false
          load: true
          tags: tagwarden:scan
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tagwarden:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  chart-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.1.4
      # Same packaging as the release, with a throwaway version.
      - name: Package and lint the release chart
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: make chart-package CHART_VERSION="0.0.0-ci.${SHA::7}" CHART_IMAGE="ghcr.io/${OWNER,,}/tagwarden"

  publish:
    if: github.event_name == 'push'
    needs: [image, chart-package]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compute names
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            version="${REF_NAME#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::tag is not v<semver>"
              exit 1
            fi
          else
            version="main-${SHA::7}"
          fi
          owner="${OWNER,,}"
          {
            echo "version=$version"
            echo "owner=$owner"
            echo "image=ghcr.io/$owner/tagwarden"
            echo "epoch=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Sign the image and attest the SBOM
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$IMAGE_REF"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: github.ref_type == 'tag'
        with:
          version: v4.1.4
      - name: Package, push and sign the chart
        id: chart
        if: github.ref_type == 'tag'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          OWNER: ${{ steps.meta.outputs.owner }}
          IMAGE: ${{ steps.meta.outputs.image }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          make chart-package CHART_VERSION="$VERSION" CHART_IMAGE="$IMAGE"
          printf '%s' "$TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
          out=$(helm push "bin/chart/tagwarden-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1)
          echo "$out"
          digest=$(awk '/^Digest:/ {print $2}' <<<"$out")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no chart digest in helm push output"; exit 1; }
          ref="ghcr.io/$OWNER/charts/tagwarden@$digest"
          cosign sign --yes "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Verify signatures and the SBOM attestation
        env:
          REPO: ${{ github.repository }}
          IMAGE_REF: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
          CHART_REF: ${{ steps.chart.outputs.ref }}
        run: |
          identity="^https://github\.com/${REPO//./\\.}/\.github/workflows/build\.yaml@refs/(heads/main|tags/v.+)$"
          issuer=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE_REF" >/dev/null
          cosign verify-attestation --type spdxjson --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer "$issuer" "$IMAGE_REF" >/dev/null
          if [ -n "$CHART_REF" ]; then
            cosign verify --certificate-identity-regexp "$identity" --certificate-oidc-issuer "$issuer" "$CHART_REF" >/dev/null
          fi
          echo "Verified $IMAGE_REF ${CHART_REF}"
