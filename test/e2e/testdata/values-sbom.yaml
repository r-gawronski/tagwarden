# helm upgrade of the SBOM e2e tests: targets and mirrors. The Secrets and
# namespaces they reference exist before the upgrade. The generator is the
# chart's trivy.image, set on the command line.
targets:
  # Generates and requires a CycloneDX SBOM for every image child.
  - name: e2e-sbom
    spec:
      registry: target.e2e-infra.svc.cluster.local:5000
      credentialsSecretRef: {name: target-push}
      caBundleSecretRef: {name: e2e-ca}
      proxy:
        httpsProxy: http://proxy.e2e-infra.svc.cluster.local:3128
        noProxy: [target.e2e-infra.svc.cluster.local]
        credentialsSecretRef: {name: proxy-auth}
      sourceCABundles:
        - registry: source.example.internal:5000
          secretRef: {name: e2e-ca}
      allowedSources: [source.example.internal:5000]
      projects:
        - name: sbom
          namespaceSelector:
            matchLabels: {e2e.tagwarden.dev/team: "true"}
          allowRepositoryOverride: true
      sbom: {mode: Generate, required: true}
  # No policy until the backfill test turns it on. Another project, so
  # e2e-sbom does not report it as WeakerTargetOnRegistry.
  - name: e2e-sbom-later
    spec:
      registry: target.e2e-infra.svc.cluster.local:5000
      credentialsSecretRef: {name: target-push}
      caBundleSecretRef: {name: e2e-ca}
      proxy:
        httpsProxy: http://proxy.e2e-infra.svc.cluster.local:3128
        noProxy: [target.e2e-infra.svc.cluster.local]
        credentialsSecretRef: {name: proxy-auth}
      sourceCABundles:
        - registry: source.example.internal:5000
          secretRef: {name: e2e-ca}
      allowedSources: [source.example.internal:5000]
      projects:
        - name: later
          namespaceSelector:
            matchLabels: {e2e.tagwarden.dev/team: "true"}
          allowRepositoryOverride: true
mirrors:
  - name: sbom-app
    namespace: e2e-team
    spec:
      targetRef: e2e-sbom
      # Never due during a test run; the tests start Jobs by hand.
      schedule: "0 0 1 1 *"
      source: {registry: source.example.internal:5000, repository: e2e/sbom-app}
      target: {project: sbom, repository: e2e/sbom-app}
      tags: {tags: ["1.0.0"]}
  - name: sbom-broken
    namespace: e2e-team
    spec:
      targetRef: e2e-sbom
      schedule: "0 0 1 1 *"
      source: {registry: source.example.internal:5000, repository: e2e/sbom-broken}
      target: {project: sbom, repository: e2e/sbom-broken}
      tags: {tags: ["1.0.0"]}
  - name: sbom-later
    namespace: e2e-team
    spec:
      targetRef: e2e-sbom-later
      schedule: "0 0 1 1 *"
      source: {registry: source.example.internal:5000, repository: e2e/sbom-app}
      target: {project: later, repository: e2e/sbom-app}
      tags: {tags: ["1.0.0"]}
